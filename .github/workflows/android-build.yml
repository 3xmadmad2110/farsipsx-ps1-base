name: Build Android APK

# Builds the DuckStation Android frontend (GPL-3.0) for arm64-v8a,
# armeabi-v7a and x86_64, producing installable, signed release APKs.
#
# Based on stenzek/duckstation commit 81da9be (2021-06-07), the last
# commit that still contained the Android frontend source under GPL-3.0.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (full history + tags for versioning)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK components
        env:
          # cmdline-tools 16.0 gates on JDK 17; we use JDK 11 for AGP 4.2.1,
          # so bypass that check. We use the preinstalled cmdline-tools/12.0
          # ('latest'), which is compatible with JDK 11.
          SKIP_JDK_VERSION_CHECK: 'true'
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $SDKMGR"
          "$SDKMGR" --version
          # Accept licenses (ignore exit code; install pipes 'yes' anyway)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platforms;android-29" \
            "build-tools;30.0.2" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"
          echo "=== installed components ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null
          ls "$ANDROID_HOME/ndk/" 2>/dev/null
          ls "$ANDROID_HOME/cmake/" 2>/dev/null
          ls "$ANDROID_HOME/platforms/" 2>/dev/null
          java -version

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APKs (per-ABI, unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/duckstation.keystore" \
            -alias duckstation \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass duckstation -keypass duckstation \
            -dname "CN=DuckStation, OU=SelfBuild, O=SelfBuild, C=US"

      - name: Sign APKs
        run: |
          set -e
          BT="$ANDROID_SDK_ROOT/build-tools/30.0.2"
          mkdir -p signed
          echo "Unsigned APKs produced:"
          ls -la android/app/build/outputs/apk/release/ || true
          for apk in android/app/build/outputs/apk/release/*-unsigned.apk; do
            [ -e "$apk" ] || { echo "No unsigned APK found at $apk"; exit 1; }
            base=$(basename "$apk" -unsigned.apk)         # app-arm64-v8a-release
            abi=$(echo "$base" | sed 's/app-\(.*\)-release/\1/')
            out="signed/duckstation-${abi}-release.apk"
            echo "Signing $apk -> $out"
            "$BT/apksigner" sign \
              --ks "$HOME/duckstation.keystore" \
              --ks-pass pass:duckstation \
              --ks-key-alias duckstation \
              --key-pass pass:duckstation \
              --out "$out" "$apk"
            echo "Verifying $out:"
            "$BT/apksigner" verify --print-certs "$out" | head -5
            "$BT/aapt" dump badging "$out" | grep -E "package:|sdkVersion|native-code" | head
          done
          ls -la signed/

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: duckstation-android-apks
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 90
